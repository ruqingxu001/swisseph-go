name: Go validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/generate.py
      - run: python3 tools/generate_api.py && python3 tools/build_api_cases.py
      - run: git diff --exit-code -- api.json api_generated.go internal/ephemeris/api.go testdata/api_cases.json
      - run: go test -v -tags differential,fluttercompare -coverpkg=./internal/ephemeris -coverprofile=core.cover ./... -timeout 10m | tee full-test.log
        shell: bash
        env:
          CGO_ENABLED: '0'
          SWISSGO_TEST_EPHE_PATH: ${{ github.workspace }}/ephe
          SWISSGO_TEST_JPL_FILE: ${{ github.workspace }}/testdata/jpl/de200.eph
      - run: |
          go tool cover -func=core.cover > core-functions.txt
          python3 tools/write_coverage.py --log full-test.log --functions core-functions.txt
      - run: go test -tags fluttercompare ./... -timeout 5m
        env:
          CGO_ENABLED: '0'
          SWISSGO_TEST_EPHE_PATH: ${{ github.workspace }}/ephe
          SWISSGO_FLUTTER_REFERENCE: testdata/flutter/linux-wrapper.jsonl
      - run: go test -race -tags differential,fluttercompare ./... -timeout 10m
        env:
          SWISSGO_TEST_EPHE_PATH: ${{ github.workspace }}/ephe
          SWISSGO_TEST_JPL_FILE: ${{ github.workspace }}/testdata/jpl/de200.eph
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: |
            core.cover
            core-functions.txt
            full-test.log
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
